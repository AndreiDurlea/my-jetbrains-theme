name: Release Plugin

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup CoreCatalog Deploy Key
        if: env.CORECATALOG_DEPLOY_KEY != ''
        uses: webfactory/ssh-agent@v0.9.0
        env:
          CORECATALOG_DEPLOY_KEY: ${{ secrets.CORECATALOG_DEPLOY_KEY }}
        with:
          ssh-private-key: ${{ secrets.CORECATALOG_DEPLOY_KEY }}

      - name: Checkout CoreCatalog
        uses: actions/checkout@v4
        with:
          repository: 'AndreiDurlea/corecatalog'
          ssh-key: ${{ secrets.CORECATALOG_DEPLOY_KEY }}
          path: '.corecatalog'

      - name: CoreCatalog Unified Release
        id: release
        uses: ./.corecatalog/.github/actions/unified-release
        with:
          source: 'json'
          file: 'package.json'
          commit: 'true'
          package-command: |
            npm run package
          package-files: 'dist/*.jar'
          title: 'Deuterium for JetBrains IDEs'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Plugin Update Feed
        if: steps.release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$TAG" dist/updatePlugins.xml --clobber

      - name: Publish to JetBrains Marketplace
        if: steps.release.outputs.should_release == 'true' && env.JETBRAINS_MARKETPLACE_TOKEN != ''
        continue-on-error: true
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          JAR: ${{ steps.release.outputs.artifact }}
        run: |
          curl --fail-with-body -sS \
            --header "Authorization: Bearer $JETBRAINS_MARKETPLACE_TOKEN" \
            -F xmlId=com.andreidurlea.deuterium \
            -F file=@"$JAR" \
            https://plugins.jetbrains.com/api/updates/upload